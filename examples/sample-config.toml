# wtf — What's The Function? sample configuration
# Copy to ~/.config/wtf/config.toml and adjust.

# ── Provider ─────────────────────────────────────────────────────────
[provider]
# Backend type (only "ollama" supported in v0.1)
kind = "ollama"

# Ollama endpoint (local-first, no cloud)
base_url = "http://127.0.0.1:11434"

# Model name — any Ollama-pulled model works.
# List available models: ollama list
# Recommended: qwen2.5-coder:14b, qwen2.5-coder:7b, gemma4
model = "qwen2.5-coder:14b"

# Request timeout in seconds
timeout_seconds = 20

# ── Policy engine ────────────────────────────────────────────────────
[policy]
# Mode: "enforce" (default) — block high-risk commands.
#        "off"     — disable all policy checks (not recommended).
mode = "enforce"

# Allow medium-risk commands (redirects, tee, etc.) to be inserted.
# When false, redirects are refused; when true, they are flagged but allowed.
allow_medium_risk_insert = false

# Maximum buffer length in bytes before rejection.
max_buffer_bytes = 8192

# ── Context ──────────────────────────────────────────────────────────
[context]
# Auto-detect git repo info (branch, dirty status).
include_git = true

# Include last command text in context sent to the model.
include_last_command = true

# Include last command output in context sent to the model.
include_last_output = true

# Maximum bytes of last-command output to include.
max_last_output_bytes = 4096

# ── UI ───────────────────────────────────────────────────────────────
[ui]
# Show summary line after proposal.
show_summary = true
