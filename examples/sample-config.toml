# wtf — What's The Function? sample configuration
# Copy to ~/.config/wtf/config.toml and adjust.

# ── Model backend ────────────────────────────────────────────────────
[model]
# Ollama endpoint (local-first, no cloud)
endpoint = "http://127.0.0.1:11434"

# Model name — any Ollama-pulled model works.
# Recommended: codellama, deepseek-coder, qwen2.5-coder
name = "qwen2.5-coder:7b"

# Request timeout in seconds
timeout = 30

# Temperature (0.0 = deterministic, 1.0 = creative)
temperature = 0.1

# Maximum tokens in the response
max_tokens = 512

# ── Policy engine ────────────────────────────────────────────────────
[policy]
# Mode: "enforce" (default) — block high-risk commands.
#        "warn"    — allow but flag in the summary.
#        "off"     — disable all policy checks (not recommended).
mode = "enforce"

# Allow medium-risk commands (redirects, tee, etc.) to be inserted.
# When false, redirects are refused; when true, they are flagged but allowed.
allow_medium_risk_insert = false

# Maximum buffer length in bytes before rejection.
max_buffer_bytes = 8192

# ── Context ──────────────────────────────────────────────────────────
[context]
# Auto-detect git repo info (branch, dirty status).
include_git = true

# Include last command output in context sent to the model.
include_last_output = true

# Maximum bytes of last-command output to include.
max_last_output_bytes = 4096

# ── Shell integration ────────────────────────────────────────────────
[shell]
# Default shell for context when auto-detection fails.
default = "bash"

# ── Keybindings (informational — actual binds are in shell adapters)
[keybindings]
# Primary trigger: Ctrl+Space
primary = "C-@"

# Fallback trigger: Alt+g
fallback = "M-g"

# ── Logging ──────────────────────────────────────────────────────────
[logging]
# Log level: "debug", "info", "warning", "error"
level = "warning"

# Log file path (empty string = stderr only)
file = ""

# ── Response protocol ───────────────────────────────────────────────
[protocol]
# Expected response schema version
version = 1

# Maximum total response size in bytes
max_response_bytes = 8192
